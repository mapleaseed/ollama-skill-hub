<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ollama Skill Hub Chat</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --sidebar: #f6f6f3;
      --panel: #ffffff;
      --panel-soft: #f9f9f7;
      --text: #202124;
      --muted: #71757a;
      --muted-strong: #565b61;
      --line: #deded8;
      --line-strong: #c8c8c1;
      --accent: #161719;
      --accent-soft: #ecefed;
      --user-soft: #eef5f2;
      --danger: #a03a3a;
      --shadow: 0 18px 48px rgba(20, 22, 24, 0.1);
      --shadow-soft: 0 8px 24px rgba(20, 22, 24, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
      transition: background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: #fbfbfa;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    button.ghost {
      background: transparent;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    select,
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 10px;
    }

    select:focus,
    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(22, 23, 25, 0.08);
    }

    .shell {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--sidebar);
      padding: 12px 10px;
      overflow: auto;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 2px 2px 8px;
    }

    .brand {
      font-size: 14px;
      font-weight: 680;
      letter-spacing: 0;
    }

    .sidebar-nav {
      display: grid;
      gap: 3px;
      margin-bottom: 18px;
    }

    .nav-button {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: center;
      width: 100%;
      min-height: 32px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 6px 8px;
    }

    .nav-button:hover {
      background: rgba(22, 23, 25, 0.06);
    }

    .nav-icon {
      color: var(--muted);
      font-size: 17px;
      line-height: 1;
    }

    .sidebar-section-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 620;
      margin: 0 8px 8px;
    }

    .sidebar-search {
      margin: 0 2px 10px;
    }

    .sidebar-search input {
      min-height: 32px;
      border-color: transparent;
      background: rgba(255, 255, 255, 0.72);
      font-size: 12px;
    }

    .history-grid {
      column-count: 1;
      column-gap: 12px;
    }

    .history-card {
      display: inline-block;
      width: 100%;
      margin: 0 0 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      box-shadow: none;
      padding: 8px 9px;
      break-inside: avoid;
      text-align: left;
    }

    .history-card:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.58);
    }

    .history-card.active {
      border-color: var(--line-strong);
      background: var(--panel);
      box-shadow: var(--shadow-soft);
    }

    .history-title {
      font-size: 13px;
      font-weight: 620;
      margin-bottom: 2px;
      word-break: break-word;
    }

    .history-summary {
      color: var(--muted);
      font-size: 11px;
      min-height: 20px;
      word-break: break-word;
    }

    .history-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100vh;
      min-width: 0;
      background: var(--bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 246, 243, 0.9);
      padding: 12px 24px;
      backdrop-filter: blur(12px);
    }

    .topbar-title {
      min-width: 0;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .topbar-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .title-input {
      display: none;
      width: min(420px, 58vw);
      min-height: 30px;
      padding: 4px 8px;
      font-size: 14px;
      font-weight: 650;
    }

    .topbar-title.editing strong,
    .topbar-title.editing .title-edit-button {
      display: none;
    }

    .topbar-title.editing .title-input {
      display: block;
    }

    .title-edit-button {
      display: inline-grid;
      place-items: center;
      width: 26px;
      min-width: 26px;
      min-height: 26px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
    }

    .title-edit-button:hover {
      background: rgba(22, 23, 25, 0.06);
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    .messages-shell {
      position: relative;
      min-height: 0;
    }

    .messages {
      height: 100%;
      overflow: auto;
      padding: 30px min(8vw, 92px) 32px;
    }

    .message {
      max-width: 900px;
      margin: 0 auto 22px;
      display: grid;
      gap: 7px;
    }

    .bubble {
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      padding: 4px 0;
      word-break: break-word;
      overflow: hidden;
    }

    .bubble.plain-text {
      white-space: pre-wrap;
    }

    .message.user .bubble {
      justify-self: end;
      max-width: min(720px, 88%);
      border-color: #d8e5e0;
      background: var(--user-soft);
      padding: 10px 13px;
    }

    .markdown-body {
      white-space: normal;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin: 16px 0 8px;
      line-height: 1.28;
    }

    .markdown-body h1 {
      font-size: 22px;
    }

    .markdown-body h2 {
      font-size: 19px;
    }

    .markdown-body h3 {
      font-size: 16px;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body pre {
      margin: 0 0 12px;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 22px;
    }

    .markdown-body li + li {
      margin-top: 4px;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent);
      color: var(--muted-strong);
      padding: 4px 0 4px 12px;
      background: #f1f5f3;
    }

    .markdown-body code {
      border: 1px solid #d8e0de;
      border-radius: 5px;
      background: #f3f7f6;
      padding: 1px 5px;
      font-family: Consolas, "JetBrains Mono", monospace;
      font-size: 13px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(46, 111, 115, 0.35);
    }

    .code-block {
      border: 1px solid #2f3536;
      border-radius: 8px;
      overflow: hidden;
      background: #1f2526;
      color: #eef4f3;
      margin: 0 0 12px;
    }

    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      border-bottom: 1px solid #333c3d;
      background: #293132;
      color: #c9d7d5;
      padding: 5px 8px 5px 12px;
      font-size: 12px;
    }

    .copy-code-button {
      min-height: 26px;
      border-color: #4b5758;
      background: #354041;
      color: #eef4f3;
      padding: 3px 9px;
      font-size: 12px;
    }

    .code-block pre {
      margin: 0;
      overflow: auto;
      padding: 12px 14px;
    }

    .code-block code {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      white-space: pre;
      font-size: 13px;
    }

    .jump-bottom {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 2;
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      box-shadow: var(--shadow-soft);
    }

    .jump-bottom[hidden] {
      display: none;
    }

    .role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
    }

    .message.user .role {
      justify-self: end;
      padding-right: 2px;
    }

    details.thinking {
      border: 1px solid #deded8;
      border-radius: 8px;
      background: #fafaf8;
      overflow: hidden;
    }

    details.thinking summary {
      cursor: pointer;
      padding: 8px 12px;
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 650;
    }

    .thinking-body {
      border-top: 1px solid #deded8;
      padding: 10px 12px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "JetBrains Mono", monospace;
      font-size: 12px;
    }

    .composer-wrap {
      background: linear-gradient(180deg, rgba(246, 246, 243, 0), var(--bg) 24%);
      padding: 18px min(8vw, 92px) 18px;
    }

    .composer {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 13px;
      position: relative;
    }

    .config-panel {
      position: absolute;
      left: 0;
      bottom: calc(100% + 10px);
      z-index: 5;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(640px, 100%);
      min-height: 312px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.98);
      transform-origin: bottom left;
      transition: opacity 0.16s ease, transform 0.16s ease;
      overflow: hidden;
    }

    .config-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .config-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
    }

    .config-panel-head strong {
      display: block;
      font-size: 13px;
    }

    .config-panel-head span {
      color: var(--muted);
      font-size: 11px;
    }

    .config-body {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      min-height: 0;
    }

    .config-menu {
      border-right: 1px solid var(--line);
      background: var(--panel-soft);
      padding: 8px;
    }

    .config-tab {
      width: 100%;
      min-height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted-strong);
      text-align: left;
      padding: 6px 8px;
    }

    .config-tab.active {
      background: var(--accent-soft);
      color: var(--text);
    }

    .config-detail {
      padding: 12px;
      overflow: auto;
    }

    .config-section {
      display: none;
    }

    .config-section.active {
      display: grid;
      gap: 10px;
    }

    .model-option-list {
      display: grid;
      gap: 6px;
    }

    .model-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      background: var(--panel);
      text-align: left;
      padding: 7px 9px;
    }

    .model-option.active {
      border-color: var(--line-strong);
      background: var(--accent-soft);
    }

    .model-option-name {
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-option-adapter {
      color: var(--muted);
      font-size: 10px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 620;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      gap: 10px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 0 10px;
    }

    .prompt {
      min-height: 78px;
      max-height: 220px;
      resize: vertical;
      border: 0;
      padding: 2px 0;
      outline: none;
      background: transparent;
      line-height: 1.6;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .left-actions,
    .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-line {
      color: var(--muted);
      font-size: 11px;
      min-width: 36px;
    }

    .file-line.warning {
      color: var(--danger);
    }

    .file-picker {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 32px;
      min-width: 32px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      overflow: hidden;
    }

    .file-picker:hover {
      border-color: var(--line-strong);
      background: #fbfbfa;
    }

    .file-picker input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .attachment-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .attachment-list[hidden] {
      display: none;
    }

    .attachment-card,
    .message-attachment {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      padding: 8px 34px 8px 8px;
      box-shadow: 0 1px 3px rgba(20, 22, 24, 0.04);
      font-size: 12px;
    }

    .attachment-card {
      width: min(240px, 100%);
    }

    .attachment-icon {
      display: inline-grid;
      place-items: center;
      width: 42px;
      min-width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #f1f1f0;
      color: #7a7e83;
      font-size: 17px;
      font-weight: 700;
    }

    .attachment-icon.word {
      background: #eaf2ff;
      color: #2367c8;
    }

    .attachment-icon.excel {
      background: #e8f6ee;
      color: #207a42;
    }

    .attachment-icon.powerpoint {
      background: #fff0e8;
      color: #b65321;
    }

    .attachment-icon.pdf {
      background: #fff0f0;
      color: #c93d3d;
      font-size: 13px;
    }

    .attachment-icon.text {
      background: #f1f2f4;
      color: #5f656d;
      font-size: 12px;
    }

    .attachment-icon.markdown {
      background: #edf2f8;
      color: #44607c;
      font-size: 12px;
    }

    .attachment-icon.log {
      background: #f5f3ec;
      color: #786b4f;
      font-size: 12px;
    }

    .attachment-icon.config {
      background: #eef0f2;
      color: #59616b;
      font-size: 12px;
    }

    .attachment-icon.image {
      background: #edf7ee;
      color: #2f7d46;
      font-size: 12px;
    }

    .attachment-icon.video {
      background: #eef2ff;
      color: #4d5fd6;
      font-size: 12px;
    }

    .attachment-icon.audio {
      background: #f3ecfb;
      color: #7650ad;
      font-size: 12px;
    }

    .attachment-icon.code {
      background: #f1eefc;
      color: #6a52b3;
      font-size: 13px;
    }

    .attachment-icon.data {
      background: #edf7f7;
      color: #26727a;
      font-size: 12px;
    }

    .attachment-icon.archive {
      background: #fff4df;
      color: #a66500;
      font-size: 13px;
    }

    .attachment-icon.executable {
      background: #f1f1f0;
      color: #4d5157;
      font-size: 12px;
    }

    .attachment-icon.system {
      background: #eceff3;
      color: #4e5967;
      font-size: 12px;
    }

    .attachment-icon.database {
      background: #eef5f8;
      color: #376a83;
      font-size: 12px;
    }

    .attachment-icon.design {
      background: #fff0f7;
      color: #b04778;
      font-size: 12px;
    }

    .attachment-icon.font {
      background: #f6f1e8;
      color: #7a6040;
      font-size: 14px;
    }

    .attachment-meta {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
      line-height: 1.25;
    }

    .attachment-size {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .attachment-remove {
      position: absolute;
      top: 7px;
      right: 7px;
      display: inline-grid;
      place-items: center;
      width: 18px;
      min-width: 18px;
      min-height: 18px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      padding: 0;
      font-size: 13px;
      line-height: 1;
    }

    .attachment-remove:hover {
      background: #34363a;
      color: white;
    }

    .message-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0;
    }

    .message-attachment {
      min-height: 44px;
      padding: 6px 10px 6px 6px;
      background: var(--panel-soft);
    }

    .message-attachment .attachment-icon {
      width: 32px;
      min-width: 32px;
      height: 32px;
      font-size: 13px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 32px;
      min-width: 32px;
      padding: 0;
      color: var(--muted-strong);
      font-size: 20px;
      line-height: 1;
    }

    .model-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 5px 8px;
      font-size: 12px;
    }

    .model-pill:hover {
      background: rgba(22, 23, 25, 0.06);
    }

    .model-pill::after {
      content: "⌄";
      color: var(--muted);
      font-size: 13px;
    }

    .adapter-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      border: 0;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .send-icon {
      display: inline-grid;
      place-items: center;
      width: 34px;
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      padding: 0;
      font-size: 18px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      max-width: 560px;
      margin: 86px auto;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.46);
      padding: 28px 22px;
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
        height: auto;
      }

      .shell {
        grid-template-columns: 1fr;
        height: auto;
      }

      .sidebar {
        max-height: 320px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .history-grid {
        column-count: 2;
      }

      .workspace {
        height: calc(100vh - 320px);
        min-height: 640px;
      }

      .config-panel {
        left: 0;
        right: 0;
        width: 100%;
      }

      .config-body,
      .config-grid {
        grid-template-columns: 1fr;
      }

      .config-menu {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .config-tab {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">Ollama Skill Hub</div>
      </div>
      <nav class="sidebar-nav" aria-label="主导航">
        <button id="newSessionButton" class="nav-button" type="button">
          <span class="nav-icon">↗</span>
          <span>新对话</span>
        </button>
        <button id="configNavButton" class="nav-button" type="button">
          <span class="nav-icon">⚙</span>
          <span>配置</span>
        </button>
      </nav>
      <div class="sidebar-section-title">对话</div>
      <div class="sidebar-search">
        <input id="historySearchInput" type="text" placeholder="搜索对话" autocomplete="off">
      </div>
      <div id="historyGrid" class="history-grid"></div>
    </aside>

    <main class="workspace">
      <div class="topbar">
        <div class="topbar-title">
          <div class="title-line">
            <strong id="sessionTitle">未选择会话</strong>
            <input id="sessionTitleInput" class="title-input" type="text" maxlength="80" autocomplete="off">
            <button id="titleEditButton" class="title-edit-button" type="button" aria-label="编辑标题">✎</button>
          </div>
          <span id="sessionMeta" class="meta">idle</span>
        </div>
        <div class="right-actions">
          <button id="deleteSessionButton" class="ghost" type="button">删除</button>
        </div>
      </div>

      <div class="messages-shell">
        <div id="messages" class="messages">
          <div class="empty">创建或选择一个会话后开始。</div>
        </div>
        <button id="jumpBottomButton" class="jump-bottom" type="button" hidden>回到底部</button>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <div id="configPanel" class="config-panel" aria-hidden="true">
            <div class="config-panel-head">
              <div>
                <strong id="configTitle">模型配置</strong>
                <span id="configSubtitle">选择本次对话使用的模型</span>
              </div>
              <button id="confirmConfigButton" type="button">完成</button>
            </div>
            <div class="config-body">
              <div class="config-menu">
                <button class="config-tab active" type="button" data-config-section="model">模型</button>
                <button class="config-tab" type="button" data-config-section="agent">Agent</button>
                <button class="config-tab" type="button" data-config-section="rag">RAG</button>
                <button class="config-tab" type="button" data-config-section="output">输出</button>
              </div>
              <div class="config-detail">
                <section class="config-section active" data-config-section-panel="model">
                  <div id="modelOptionList" class="model-option-list"></div>
                  <label>
                    模型名称
                    <input id="modelInput" type="text" autocomplete="off">
                  </label>
                  <div id="modelAdapterHint" class="adapter-hint"></div>
                  <select id="modelAdapterSelect" class="visually-hidden" aria-hidden="true" tabindex="-1"></select>
                </section>
                <section class="config-section" data-config-section-panel="agent">
                  <div class="config-grid">
                    <label>
                      Agent
                      <select id="agentSelect"></select>
                    </label>
                    <label>
                      Skill
                      <select id="skillSelect"></select>
                    </label>
                  </div>
                </section>
                <section class="config-section" data-config-section-panel="rag">
                  <div class="config-grid">
                    <label>
                      RAG 数据库
                      <select id="ragStoreSelect"></select>
                    </label>
                    <label>
                      Top K
                      <input id="topKInput" type="number" min="1" max="20" value="5">
                    </label>
                  </div>
                  <div class="switch-row">
                    <span>开启 RAG</span>
                    <input id="ragToggle" type="checkbox">
                  </div>
                </section>
                <section class="config-section" data-config-section-panel="output">
                  <div class="switch-row">
                    <span>Thinking</span>
                    <input id="thinkingToggle" type="checkbox">
                  </div>
                  <div class="switch-row">
                    <span>流式输出</span>
                    <input id="streamToggle" type="checkbox" checked>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <div id="attachmentList" class="attachment-list" hidden></div>
          <textarea id="taskInput" class="prompt" placeholder="输入任务，Enter 发送，Shift + Enter 换行"></textarea>
          <div class="composer-actions">
            <div class="left-actions">
              <button id="configButton" class="icon-button" type="button" aria-label="打开配置" aria-expanded="false" aria-controls="configPanel">+</button>
              <label class="file-picker" title="添加附件，最多 5 个文件">
                <span>📎</span>
                <input id="fileInput" type="file" multiple>
              </label>
              <span id="fileLine" class="file-line">0 / 5</span>
            </div>
            <div class="right-actions">
              <button id="modelPillButton" class="model-pill" type="button" title="">模型</button>
              <button id="sendButton" class="primary send-icon" type="button" aria-label="发送">↑</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SCROLL_FOLLOW_THRESHOLD = 80;
    const API_BASE = location.protocol === "file:" ? "http://127.0.0.1:8011" : "";

    const state = {
      registry: null,
      sessions: [],
      currentSession: null,
      currentMessages: [],
      pendingTask: "",
      uploadFiles: [],
      editingTitleSessionId: "",
      editingTitleOriginal: "",
      autoScrollEnabled: true,
      isGenerating: false
    };

    const els = {
      historyGrid: document.getElementById("historyGrid"),
      newSessionButton: document.getElementById("newSessionButton"),
      configNavButton: document.getElementById("configNavButton"),
      historySearchInput: document.getElementById("historySearchInput"),
      deleteSessionButton: document.getElementById("deleteSessionButton"),
      sessionTitle: document.getElementById("sessionTitle"),
      sessionTitleInput: document.getElementById("sessionTitleInput"),
      titleEditButton: document.getElementById("titleEditButton"),
      sessionMeta: document.getElementById("sessionMeta"),
      messages: document.getElementById("messages"),
      jumpBottomButton: document.getElementById("jumpBottomButton"),
      configPanel: document.getElementById("configPanel"),
      configTitle: document.getElementById("configTitle"),
      configSubtitle: document.getElementById("configSubtitle"),
      configButton: document.getElementById("configButton"),
      confirmConfigButton: document.getElementById("confirmConfigButton"),
      agentSelect: document.getElementById("agentSelect"),
      skillSelect: document.getElementById("skillSelect"),
      modelAdapterSelect: document.getElementById("modelAdapterSelect"),
      modelInput: document.getElementById("modelInput"),
      modelOptionList: document.getElementById("modelOptionList"),
      modelAdapterHint: document.getElementById("modelAdapterHint"),
      modelPillButton: document.getElementById("modelPillButton"),
      ragStoreSelect: document.getElementById("ragStoreSelect"),
      topKInput: document.getElementById("topKInput"),
      ragToggle: document.getElementById("ragToggle"),
      thinkingToggle: document.getElementById("thinkingToggle"),
      streamToggle: document.getElementById("streamToggle"),
      taskInput: document.getElementById("taskInput"),
      attachmentList: document.getElementById("attachmentList"),
      fileInput: document.getElementById("fileInput"),
      fileLine: document.getElementById("fileLine"),
      sendButton: document.getElementById("sendButton"),
      configTabs: Array.from(document.querySelectorAll(".config-tab")),
      configSections: Array.from(document.querySelectorAll(".config-section"))
    };

    function apiFetch(path, options) {
      return fetch(`${API_BASE}${path}`, options);
    }

    async function init() {
      bindEvents();
      await loadRegistry();
      await loadSessions();
      if (state.sessions.length) {
        await openSession(state.sessions[0].id);
      }
    }

    function bindEvents() {
      els.newSessionButton.addEventListener("click", createSession);
      els.configNavButton.addEventListener("click", () => openConfigSection("model"));
      els.deleteSessionButton.addEventListener("click", deleteCurrentSession);
      els.titleEditButton.addEventListener("click", startTitleEdit);
      els.sessionTitleInput.addEventListener("blur", saveTitleEdit);
      els.sessionTitleInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          els.sessionTitleInput.blur();
        } else if (event.key === "Escape") {
          event.preventDefault();
          cancelTitleEdit();
        }
      });
      els.configButton.addEventListener("click", () => {
        if (els.configPanel.classList.contains("open")) {
          setConfigPanelOpen(false);
        } else {
          openConfigSection("model");
        }
      });
      els.confirmConfigButton.addEventListener("click", () => setConfigPanelOpen(false));
      els.modelPillButton.addEventListener("click", () => openConfigSection("model"));
      els.modelAdapterSelect.addEventListener("change", syncModelName);
      els.modelInput.addEventListener("input", updateModelDisplay);
      els.historySearchInput.addEventListener("input", renderHistory);
      els.fileInput.addEventListener("change", handleFileSelect);
      els.sendButton.addEventListener("click", sendMessage);
      els.configTabs.forEach((tab) => {
        tab.addEventListener("click", () => openConfigSection(tab.dataset.configSection));
      });
      els.messages.addEventListener("scroll", setAutoScrollByUserPosition, {passive: true});
      els.jumpBottomButton.addEventListener("click", () => {
        state.autoScrollEnabled = true;
        scrollMessages();
      });
      els.taskInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
    }

    function setConfigPanelOpen(open) {
      els.configPanel.classList.toggle("open", open);
      els.configPanel.setAttribute("aria-hidden", String(!open));
      els.configButton.setAttribute("aria-expanded", String(open));
    }

    function openConfigSection(section) {
      const target = section || "model";
      const titles = {
        model: ["模型配置", "选择本次对话使用的模型"],
        agent: ["Agent 配置", "调整 Agent 与 Skill 组合"],
        rag: ["RAG 配置", "选择知识库和检索参数"],
        output: ["输出配置", "调整 Thinking 与输出方式"]
      };
      els.configTabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.configSection === target);
      });
      els.configSections.forEach((panel) => {
        panel.classList.toggle("active", panel.dataset.configSectionPanel === target);
      });
      const [title, subtitle] = titles[target] || titles.model;
      els.configTitle.textContent = title;
      els.configSubtitle.textContent = subtitle;
      setConfigPanelOpen(true);
    }

    async function loadRegistry() {
      const response = await apiFetch("/registry");
      state.registry = await response.json();
      fillSelect(els.agentSelect, Object.keys(state.registry.agents));
      fillSelect(els.skillSelect, Object.keys(state.registry.skills));
      fillSelect(els.modelAdapterSelect, Object.keys(state.registry.model_adapters));
      fillSelect(els.ragStoreSelect, Object.keys(state.registry.rag_stores));
      if (Object.keys(state.registry.skills).includes("OllamaSkill")) {
        els.skillSelect.value = "OllamaSkill";
      }
      renderModelOptions();
      syncModelName();
    }

    async function loadSessions() {
      const response = await apiFetch("/api/sessions");
      const payload = await response.json();
      state.sessions = payload.sessions || [];
      renderHistory();
    }

    async function createSession() {
      const response = await apiFetch("/api/sessions", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title: "新会话"})
      });
      const session = await response.json();
      await loadSessions();
      await openSession(session.id);
      els.taskInput.focus();
    }

    async function openSession(sessionId) {
      const response = await apiFetch(`/api/sessions/${sessionId}`);
      state.currentSession = await response.json();
      state.currentMessages = state.currentSession.messages || [];
      renderHistory();
      renderSession();
    }

    async function deleteCurrentSession() {
      if (!state.currentSession) {
        return;
      }
      await apiFetch(`/api/sessions/${state.currentSession.id}`, {method: "DELETE"});
      state.currentSession = null;
      state.currentMessages = [];
      await loadSessions();
      if (state.sessions.length) {
        await openSession(state.sessions[0].id);
      } else {
        renderSession();
      }
    }

    function renderHistory() {
      els.historyGrid.innerHTML = "";
      const keyword = (els.historySearchInput.value || "").trim().toLowerCase();
      const sessions = keyword
        ? state.sessions.filter((session) => {
            const text = `${session.title || ""} ${session.summary || ""} ${session.last_model || ""}`.toLowerCase();
            return text.includes(keyword);
          })
        : state.sessions;
      sessions.forEach((session) => {
        const card = document.createElement("button");
        card.className = "history-card";
        if (state.currentSession && session.id === state.currentSession.id) {
          card.classList.add("active");
        }
        card.type = "button";
        card.innerHTML = `
          <div class="history-title">${escapeHtml(session.title || "新会话")}</div>
          <div class="history-summary">${escapeHtml(session.summary || "暂无摘要")}</div>
          <div class="history-meta">
            <span>${escapeHtml(session.last_model || "model")}</span>
            <span>${formatTime(session.updated_at)}</span>
          </div>
        `;
        card.addEventListener("click", () => openSession(session.id));
        els.historyGrid.append(card);
      });
    }

    function renderSession() {
      if (!state.currentSession) {
        els.sessionTitle.textContent = "未选择会话";
        els.sessionMeta.textContent = "idle";
        els.messages.innerHTML = '<div class="empty">创建或选择一个会话后开始。</div>';
        updateJumpBottomButton();
        return;
      }
      renderSessionHeader();
      els.messages.innerHTML = "";
      state.currentMessages.forEach((message) => appendMessage(message));
      state.autoScrollEnabled = true;
      scrollMessages();
    }

    function renderSessionHeader() {
      if (!state.currentSession) {
        return;
      }
      els.sessionTitle.textContent = state.currentSession.title || "新会话";
      els.sessionTitleInput.value = state.currentSession.title || "新会话";
      els.sessionMeta.textContent = `${state.currentSession.status || "active"} · ${formatTime(state.currentSession.updated_at)}`;
    }

    function startTitleEdit() {
      if (!state.currentSession) {
        return;
      }
      state.editingTitleSessionId = state.currentSession.id;
      state.editingTitleOriginal = state.currentSession.title || "新会话";
      els.sessionTitle.closest(".topbar-title").classList.add("editing");
      els.sessionTitleInput.value = state.editingTitleOriginal;
      els.sessionTitleInput.focus();
      els.sessionTitleInput.select();
    }

    function cancelTitleEdit() {
      els.sessionTitleInput.value = state.editingTitleOriginal || (state.currentSession ? state.currentSession.title || "新会话" : "");
      state.editingTitleSessionId = "";
      state.editingTitleOriginal = "";
      els.sessionTitle.closest(".topbar-title").classList.remove("editing");
    }

    async function saveTitleEdit() {
      const sessionId = state.editingTitleSessionId;
      if (!state.currentSession || !sessionId) {
        return;
      }
      const wrapper = els.sessionTitle.closest(".topbar-title");
      if (!wrapper.classList.contains("editing")) {
        return;
      }
      const title = els.sessionTitleInput.value.trim();
      const originalTitle = state.editingTitleOriginal || state.currentSession.title || "新会话";
      if (!title || title === originalTitle) {
        cancelTitleEdit();
        return;
      }

      applySessionTitle(sessionId, title);
      wrapper.classList.remove("editing");
      state.editingTitleSessionId = "";
      state.editingTitleOriginal = "";

      try {
        const response = await apiFetch(`/api/sessions/${sessionId}`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({title})
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        const saved = await response.json();
        applySessionTitle(sessionId, saved.title || title);
      } catch (error) {
        applySessionTitle(sessionId, originalTitle);
        console.error("标题保存失败", error);
      }
    }

    function applySessionTitle(sessionId, title) {
      if (state.currentSession && state.currentSession.id === sessionId) {
        state.currentSession = {...state.currentSession, title};
        renderSessionHeader();
      }
      state.sessions = state.sessions.map((session) => (
        session.id === sessionId ? {...session, title} : session
      ));
      renderHistory();
    }

    function appendMessage(message) {
      const item = document.createElement("div");
      item.className = `message ${message.role}`;
      item.dataset.messageId = message.id || "";

      const role = document.createElement("div");
      role.className = "role";
      role.textContent = message.role === "user" ? "你" : "Ollama Skill Hub";
      item.append(role);

      if (message.thinking) {
        item.append(createThinkingElement(message.thinking, false));
      }

      if (message.attachments && message.attachments.length) {
        item.append(createMessageAttachments(message.attachments));
      }

      const bubble = document.createElement("div");
      renderMessageContent(bubble, message.content || "", {
        markdown: message.role === "assistant"
      });
      item.append(bubble);
      els.messages.append(item);
      return {root: item, bubble};
    }

    function appendStreamingAssistant() {
      const item = document.createElement("div");
      item.className = "message assistant";

      const role = document.createElement("div");
      role.className = "role";
      role.textContent = "Ollama Skill Hub";
      item.append(role);

      const thinkingBox = createThinkingElement("", true);
      const thinkingBody = thinkingBox.querySelector(".thinking-body");
      item.append(thinkingBox);

      const bubble = document.createElement("div");
      renderMessageContent(bubble, "", {markdown: true});
      item.append(bubble);

      els.messages.append(item);
      maybeScrollMessages();
      return {
        root: item,
        bubble,
        thinkingBox,
        thinkingBody,
        rawContent: "",
        rawThinking: "",
        renderFrame: null,
        message: null
      };
    }

    function createThinkingElement(content, hidden) {
      const details = document.createElement("details");
      details.className = "thinking";
      if (hidden) {
        details.style.display = "none";
      }

      const summary = document.createElement("summary");
      summary.textContent = "思考过程";
      details.append(summary);

      const body = document.createElement("div");
      body.className = "thinking-body";
      body.textContent = content || "";
      details.append(body);
      return details;
    }

    function createMessageAttachments(attachments) {
      const wrap = document.createElement("div");
      wrap.className = "message-attachments";
      attachments.forEach((attachment) => {
        wrap.append(createAttachmentCard(attachment, {removable: false}));
      });
      return wrap;
    }

    function createAttachmentCard(attachment, options = {}) {
      const card = document.createElement("div");
      card.className = options.removable ? "attachment-card" : "message-attachment";
      const extension = attachment.extension || fileExtension(attachment.filename);

      const icon = document.createElement("span");
      icon.className = `attachment-icon ${fileIconClass(extension)}`;
      icon.textContent = fileIconText(extension);
      card.append(icon);

      const meta = document.createElement("span");
      meta.className = "attachment-meta";

      const name = document.createElement("span");
      name.className = "attachment-name";
      name.textContent = attachment.filename || "未命名文件";
      meta.append(name);

      const size = document.createElement("span");
      size.className = "attachment-size";
      size.textContent = attachmentLabel(attachment);
      meta.append(size);
      card.append(meta);

      if (options.removable) {
        const remove = document.createElement("button");
        remove.className = "attachment-remove";
        remove.type = "button";
        remove.setAttribute("aria-label", `移除 ${attachment.filename || "附件"}`);
        remove.textContent = "×";
        remove.addEventListener("click", () => removeUploadFile(options.index));
        card.append(remove);
      }
      return card;
    }

    async function sendMessage() {
      const task = els.taskInput.value.trim();
      if (!task || !validateFiles()) {
        return;
      }
      if (!state.currentSession) {
        await createSession();
      }

      els.sendButton.disabled = true;
      state.isGenerating = true;
      state.autoScrollEnabled = true;
      updateJumpBottomButton();
      const localUser = {
        id: "local-user-" + Date.now(),
        role: "user",
        content: task,
        thinking: "",
        attachments: selectedUploadFiles().map(fileToAttachmentView)
      };
      const assistantMessage = {
        id: "local-assistant-" + Date.now(),
        role: "assistant",
        content: "",
        thinking: ""
      };
      state.pendingTask = task;
      state.currentMessages.push(localUser, assistantMessage);
      appendMessage(localUser);
      const assistant = appendStreamingAssistant();
      assistant.message = assistantMessage;
      els.taskInput.value = "";

      try {
        if (els.streamToggle.checked) {
          await runStream(assistant);
        } else {
          await runWait(assistant);
        }
        flushAssistantRender(assistant);
        await loadSessions();
        syncCurrentSessionFromList();
      } catch (error) {
        setAssistantContent(assistant, `${assistant.rawContent}${String(error)}`);
        flushAssistantRender(assistant);
      } finally {
        state.isGenerating = false;
        updateJumpBottomButton();
        els.sendButton.disabled = false;
        clearUploadFiles();
      }
    }

    async function runWait(assistant) {
      const response = await apiFetch(`/api/sessions/${state.currentSession.id}/run`, {
        method: "POST",
        body: buildFormData()
      });
      const payload = await response.json();
      if (!response.ok || payload.status === "failed") {
        setAssistantContent(assistant, payload.detail || payload.result?.error || "任务执行失败");
        return;
      }
      const result = payload.result || {};
      setAssistantContent(assistant, result.content || "");
      const finalStep = result.steps && result.steps[result.steps.length - 1];
      const thinking = finalStep && finalStep.result ? finalStep.result.thinking : "";
      if (thinking) {
        setAssistantThinking(assistant, thinking);
      }
      if (payload.session) {
        state.currentSession = {...state.currentSession, ...payload.session};
        renderSessionHeader();
      }
    }

    async function runStream(assistant) {
      const response = await apiFetch(`/api/sessions/${state.currentSession.id}/stream`, {
        method: "POST",
        body: buildFormData()
      });
      if (!response.ok || !response.body) {
        setAssistantContent(assistant, await response.text());
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) {
          break;
        }
        buffer += decoder.decode(value, {stream: true});
        buffer = consumeSseBuffer(buffer, assistant);
      }
      consumeSseBuffer(buffer + "\n\n", assistant);
    }

    function consumeSseBuffer(buffer, assistant) {
      const chunks = buffer.split("\n\n");
      const rest = chunks.pop() || "";
      chunks.forEach((chunk) => {
        const line = chunk.split("\n").find((item) => item.startsWith("data: "));
        if (!line) {
          return;
        }
        let payload;
        try {
          payload = JSON.parse(line.slice(6));
        } catch (error) {
          return;
        }
        if (payload.event === "content") {
          appendAssistantContent(assistant, payload.delta || "");
        } else if (payload.event === "thinking") {
          appendAssistantThinking(assistant, payload.delta || "");
        } else if (payload.event === "error") {
          setAssistantContent(assistant, `${assistant.rawContent}${payload.error || "任务执行失败"}`);
        } else if (payload.event === "done" && !assistant.rawContent && payload.result?.content) {
          setAssistantContent(assistant, payload.result.content);
        }
      });
      return rest;
    }

    function syncCurrentSessionFromList() {
      if (!state.currentSession) {
        return;
      }
      const latest = state.sessions.find((session) => session.id === state.currentSession.id);
      if (latest) {
        state.currentSession = {...state.currentSession, ...latest};
        renderSessionHeader();
        renderHistory();
      }
    }

    function setAssistantContent(assistant, value) {
      assistant.rawContent = value || "";
      if (assistant.message) {
        assistant.message.content = assistant.rawContent;
      }
      scheduleAssistantRender(assistant);
    }

    function appendAssistantContent(assistant, delta) {
      setAssistantContent(assistant, `${assistant.rawContent}${delta || ""}`);
    }

    function setAssistantThinking(assistant, value) {
      assistant.rawThinking = value || "";
      if (assistant.message) {
        assistant.message.thinking = assistant.rawThinking;
      }
      assistant.thinkingBox.style.display = assistant.rawThinking ? "" : "none";
      assistant.thinkingBody.textContent = assistant.rawThinking;
      maybeScrollMessages();
    }

    function appendAssistantThinking(assistant, delta) {
      setAssistantThinking(assistant, `${assistant.rawThinking}${delta || ""}`);
    }

    function scheduleAssistantRender(assistant) {
      if (assistant.renderFrame) {
        return;
      }
      assistant.renderFrame = requestAnimationFrame(() => {
        assistant.renderFrame = null;
        renderMessageContent(assistant.bubble, assistant.rawContent, {markdown: true});
        maybeScrollMessages();
      });
    }

    function flushAssistantRender(assistant) {
      if (assistant.renderFrame) {
        cancelAnimationFrame(assistant.renderFrame);
        assistant.renderFrame = null;
      }
      renderMessageContent(assistant.bubble, assistant.rawContent, {markdown: true});
      maybeScrollMessages();
    }

    function renderMessageContent(element, rawText, options = {}) {
      const useMarkdown = Boolean(options.markdown);
      element.className = useMarkdown ? "bubble markdown-body" : "bubble plain-text";
      if (useMarkdown) {
        element.innerHTML = renderMarkdown(rawText);
        attachCodeCopyButtons(element);
      } else {
        element.textContent = rawText || "";
      }
    }

    function renderMarkdown(rawText) {
      const lines = String(rawText || "").replace(/\r\n?/g, "\n").split("\n");
      const html = [];
      const paragraph = [];
      let index = 0;

      const flushParagraph = () => {
        if (!paragraph.length) {
          return;
        }
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph.length = 0;
      };

      while (index < lines.length) {
        const line = lines[index];
        const fence = line.match(/^```([^\s`]*)?.*$/);
        if (fence) {
          flushParagraph();
          const language = sanitizeLanguage(fence[1] || "");
          const codeLines = [];
          index += 1;
          while (index < lines.length && !/^```\s*$/.test(lines[index])) {
            codeLines.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) {
            index += 1;
          }
          html.push(renderCodeBlock(language, codeLines.join("\n")));
          continue;
        }

        if (/^\s*$/.test(line)) {
          flushParagraph();
          index += 1;
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          index += 1;
          continue;
        }

        if (/^>\s?/.test(line)) {
          flushParagraph();
          const quoteLines = [];
          while (index < lines.length && /^>\s?/.test(lines[index])) {
            quoteLines.push(lines[index].replace(/^>\s?/, ""));
            index += 1;
          }
          html.push(`<blockquote><p>${renderInlineMarkdown(quoteLines.join(" "))}</p></blockquote>`);
          continue;
        }

        const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          const items = [];
          while (index < lines.length) {
            const item = lines[index].match(/^\s*[-*+]\s+(.+)$/);
            if (!item) {
              break;
            }
            items.push(`<li>${renderInlineMarkdown(item[1])}</li>`);
            index += 1;
          }
          html.push(`<ul>${items.join("")}</ul>`);
          continue;
        }

        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          const items = [];
          while (index < lines.length) {
            const item = lines[index].match(/^\s*\d+[.)]\s+(.+)$/);
            if (!item) {
              break;
            }
            items.push(`<li>${renderInlineMarkdown(item[1])}</li>`);
            index += 1;
          }
          html.push(`<ol>${items.join("")}</ol>`);
          continue;
        }

        paragraph.push(line.trim());
        index += 1;
      }

      flushParagraph();
      return html.join("");
    }

    function renderInlineMarkdown(text) {
      const tokens = [];
      let tokenized = String(text || "").replace(/`([^`\n]+)`/g, (_match, code) => {
        return addHtmlToken(tokens, `<code>${escapeHtml(code)}</code>`);
      });

      tokenized = tokenized.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (match, label, url) => {
        const safeUrl = sanitizeMarkdownUrl(url);
        if (!safeUrl) {
          return label;
        }
        return addHtmlToken(
          tokens,
          `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`
        );
      });

      let html = escapeHtml(tokenized)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/_([^_]+)_/g, "<em>$1</em>");

      tokens.forEach((item) => {
        html = html.replaceAll(item.token, item.html);
      });
      return html;
    }

    function addHtmlToken(tokens, html) {
      const token = `%%MD_TOKEN_${tokens.length}%%`;
      tokens.push({token, html});
      return token;
    }

    function renderCodeBlock(language, code) {
      const label = language || "text";
      return `
        <div class="code-block">
          <div class="code-toolbar">
            <span>${escapeHtml(label)}</span>
            <button class="copy-code-button" type="button">复制</button>
          </div>
          <pre><code>${escapeHtml(code)}</code></pre>
        </div>
      `;
    }

    function attachCodeCopyButtons(container) {
      container.querySelectorAll(".copy-code-button").forEach((button) => {
        button.addEventListener("click", async () => {
          const block = button.closest(".code-block");
          const code = block ? block.querySelector("code") : null;
          await copyText(code ? code.textContent : "");
          button.textContent = "已复制";
          window.setTimeout(() => {
            button.textContent = "复制";
          }, 1200);
        });
      });
    }

    async function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch (error) {
          // Fall through to the legacy copy path.
        }
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.append(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    function sanitizeLanguage(value) {
      return String(value || "").trim().replace(/[^a-z0-9_+.-]/gi, "").slice(0, 32);
    }

    function sanitizeMarkdownUrl(value) {
      const url = String(value || "").trim();
      if (/^(https?:\/\/|\/|#)/i.test(url)) {
        return url;
      }
      return "";
    }

    function buildFormData() {
      const data = new FormData();
      data.append("task", state.pendingTask);
      data.append("agent", els.agentSelect.value);
      data.append("skill", els.skillSelect.value);
      data.append("model_adapter", els.modelAdapterSelect.value);
      data.append("model", els.modelInput.value);
      data.append("rag_enabled", String(els.ragToggle.checked));
      data.append("vector_store_name", els.ragStoreSelect.value);
      data.append("top_k", els.topKInput.value);
      data.append("think", String(els.thinkingToggle.checked));
      selectedUploadFiles().forEach((file) => data.append("files", file));
      return data;
    }

    function handleFileSelect(event) {
      addUploadFiles(Array.from(event.target.files || []));
      els.fileInput.value = "";
    }

    function addUploadFiles(files) {
      const existing = new Set(state.uploadFiles.map(fileKey));
      const accepted = [];
      let overflow = false;

      files.forEach((file) => {
        const key = fileKey(file);
        if (existing.has(key)) {
          return;
        }
        if (state.uploadFiles.length + accepted.length >= 5) {
          overflow = true;
          return;
        }
        existing.add(key);
        accepted.push(file);
      });

      state.uploadFiles = [...state.uploadFiles, ...accepted];
      renderUploadFiles(overflow ? "最多 5 个文件" : "");
      return !overflow;
    }

    function validateFiles() {
      const files = selectedUploadFiles();
      if (files.length > 5) {
        renderUploadFiles("最多 5 个文件");
        return false;
      }
      renderUploadFiles();
      return true;
    }

    function selectedUploadFiles() {
      return state.uploadFiles;
    }

    function removeUploadFile(index) {
      state.uploadFiles = state.uploadFiles.filter((_, fileIndex) => fileIndex !== index);
      renderUploadFiles();
    }

    function clearUploadFiles() {
      state.uploadFiles = [];
      els.fileInput.value = "";
      renderUploadFiles();
    }

    function renderUploadFiles(message = "") {
      els.attachmentList.innerHTML = "";
      selectedUploadFiles().forEach((file, index) => {
        els.attachmentList.append(createAttachmentCard(fileToAttachmentView(file), {
          removable: true,
          index
        }));
      });
      els.attachmentList.hidden = state.uploadFiles.length === 0;
      els.fileLine.classList.toggle("warning", Boolean(message));
      els.fileLine.textContent = message || `${state.uploadFiles.length} / 5`;
    }

    function fileToAttachmentView(file) {
      return {
        filename: file.name,
        content_type: file.type || "application/octet-stream",
        size: file.size,
        extension: fileExtension(file.name)
      };
    }

    function fileKey(file) {
      return `${file.name}:${file.size}:${file.lastModified}`;
    }

    function fileExtension(filename) {
      const name = String(filename || "").trim();
      const lowerName = name.toLowerCase();
      const knownNames = {
        dockerfile: "docker",
        makefile: "make",
        readme: "readme",
        license: "license",
        changelog: "md",
        procfile: "config",
        hosts: "config"
      };
      if (knownNames[lowerName]) {
        return knownNames[lowerName].toUpperCase();
      }
      const parts = name.split(".");
      return parts.length > 1 ? parts.pop().toUpperCase().slice(0, 8) : "FILE";
    }

    function attachmentLabel(attachment) {
      return attachment.extension || fileExtension(attachment.filename);
    }

    function fileIconClass(extension) {
      return fileTypeMeta(extension).className;
    }

    function fileIconText(extension) {
      const value = String(extension || "").toLowerCase();
      return fileTypeMeta(value).label;
    }

    function fileTypeMeta(extension) {
      const value = String(extension || "").replace(/^\./, "").toLowerCase();
      const groups = [
        {className: "word", label: "DOC", values: ["doc", "docx", "dot", "dotx", "wps", "rtf"]},
        {className: "excel", label: "XLS", values: ["xls", "xlsx", "xlsm", "xlsb", "xlt", "xltx", "et", "ods"]},
        {className: "powerpoint", label: "PPT", values: ["ppt", "pptx", "pptm", "pot", "potx", "pps", "ppsx", "dps", "odp"]},
        {className: "pdf", label: "PDF", values: ["pdf"]},
        {className: "markdown", label: "MD", values: ["md", "mdx", "markdown"]},
        {className: "log", label: "LOG", values: ["log", "trace", "out"]},
        {className: "text", label: "TXT", values: ["txt", "text", "readme", "license", "rst", "ini", "properties"]},
        {className: "config", label: "CFG", values: ["conf", "cfg", "config", "env", "toml", "lock", "editorconfig", "gitignore", "dockerignore", "docker", "make"]},
        {className: "image", label: "IMG", values: ["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "ico", "heic", "avif", "tif", "tiff", "psd"]},
        {className: "video", label: "MP4", values: ["mp4", "mov", "avi", "mkv", "webm", "flv", "wmv", "m4v", "mpeg", "mpg", "3gp"]},
        {className: "audio", label: "MP3", values: ["mp3", "wav", "flac", "aac", "ogg", "m4a", "wma", "opus", "mid", "midi"]},
        {className: "code", label: "</>", values: ["py", "js", "ts", "tsx", "jsx", "java", "kt", "go", "rs", "c", "h", "cpp", "hpp", "cs", "php", "rb", "swift", "scala", "r", "m", "mm", "lua", "sh", "bash", "zsh", "ps1", "bat", "cmd", "html", "htm", "css", "scss", "less", "vue", "svelte", "sql", "xml", "proto", "gradle"]},
        {className: "data", label: "CSV", values: ["csv", "tsv", "json", "jsonl", "yaml", "yml", "parquet", "orc", "avro", "xml", "xlsx"]},
        {className: "archive", label: "ZIP", values: ["zip", "rar", "7z", "tar", "gz", "tgz", "bz2", "xz", "iso", "dmg"]},
        {className: "executable", label: "EXE", values: ["exe", "msi", "apk", "app", "deb", "rpm", "bin", "run"]},
        {className: "database", label: "DB", values: ["db", "sqlite", "sqlite3", "mdb", "accdb", "duckdb", "dbf"]},
        {className: "design", label: "UI", values: ["fig", "sketch", "ai", "eps", "xd", "indd"]},
        {className: "font", label: "Aa", values: ["ttf", "otf", "woff", "woff2", "eot"]},
        {className: "system", label: "SYS", values: ["dll", "so", "dylib", "sys"]},
      ];
      const group = groups.find((item) => item.values.includes(value));
      if (group) {
        return group;
      }
      return {
        className: "text",
        label: value ? value.toUpperCase().slice(0, 4) : "FILE"
      };
    }

    function syncModelName() {
      const adapter = state.registry.model_adapters[els.modelAdapterSelect.value];
      els.modelInput.value = adapter && adapter.model ? adapter.model : "";
      renderModelOptions();
      updateModelDisplay();
    }

    function updateModelDisplay() {
      const adapterName = els.modelAdapterSelect.value || "";
      const modelName = els.modelInput.value || "模型";
      els.modelPillButton.textContent = modelName;
      els.modelPillButton.title = adapterName ? `适配器：${adapterName}` : "";
      els.modelAdapterHint.textContent = adapterName ? `适配器：${adapterName}` : "";
    }

    function renderModelOptions() {
      els.modelOptionList.innerHTML = "";
      const adapters = state.registry ? state.registry.model_adapters : {};
      Object.entries(adapters).forEach(([name, adapter]) => {
        const button = document.createElement("button");
        const model = adapter && adapter.model ? adapter.model : name;
        button.type = "button";
        button.className = "model-option";
        if (name === els.modelAdapterSelect.value) {
          button.classList.add("active");
        }
        button.title = `适配器：${name}`;
        button.innerHTML = `
          <span class="model-option-name">${escapeHtml(model)}</span>
          <span class="model-option-adapter">${escapeHtml(name)}</span>
        `;
        button.addEventListener("click", () => {
          els.modelAdapterSelect.value = name;
          syncModelName();
        });
        els.modelOptionList.append(button);
      });
    }

    function fillSelect(select, values) {
      select.innerHTML = "";
      values.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      });
    }

    function isNearBottom(container = els.messages, threshold = SCROLL_FOLLOW_THRESHOLD) {
      return container.scrollHeight - container.scrollTop - container.clientHeight <= threshold;
    }

    function setAutoScrollByUserPosition() {
      state.autoScrollEnabled = isNearBottom();
      updateJumpBottomButton();
    }

    function maybeScrollMessages() {
      if (state.autoScrollEnabled) {
        scrollMessages();
        return;
      }
      updateJumpBottomButton();
    }

    function scrollMessages() {
      els.messages.scrollTop = els.messages.scrollHeight;
      updateJumpBottomButton();
    }

    function updateJumpBottomButton() {
      els.jumpBottomButton.hidden = !(state.isGenerating && !state.autoScrollEnabled);
    }

    function formatTime(value) {
      if (!value) {
        return "";
      }
      return new Date(value).toLocaleString();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    init().catch((error) => {
      els.messages.innerHTML = `<div class="empty">${escapeHtml(error)}</div>`;
    });
  </script>
</body>
</html>
